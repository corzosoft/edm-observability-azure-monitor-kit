[project]
name = "edm-observability-azure-monitor-kit"
version = "0.1.0"
description = "Observability starter kit for EDM-style Azure data platforms."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Open Source Contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6.0"]

[project.scripts]
edm-observe = "edm_observability.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edm_observability"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
